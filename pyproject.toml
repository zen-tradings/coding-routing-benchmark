[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-router-benchmark"
version = "0.1.0"
description = "A small benchmark for comparing Pi model router decisions"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["benchmark*"]
